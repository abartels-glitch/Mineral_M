name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches local dev (see README) so CI can't pass/fail on a
          # version difference that never gets caught locally.
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check .

      - name: Test
        # No secrets required: llm_extractor.py falls back to the regex
        # extractor whenever ANTHROPIC_API_KEY is unset, so the full
        # suite runs offline — nothing to configure in repo secrets.
        run: pytest -q
